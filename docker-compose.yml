# ---------------------------------------------------------------------------
# POC Activación de Servicios con Kafka
#
#   docker compose up -d --build
#
# Puertos en el host:
#   5173  demo-ui (React + Vite)
#   3000  activation-api (ACTIVATION_API_PORT)
#   3004  crm-analytics-service
#   3005  loyalty-service (perfil loyalty/replay)
#   8080  Kafka UI (KAFKA_UI_PORT)
#   8025  MailHog (web)         1025 MailHog (SMTP)
#   29092 Kafka (host)         27017 MongoDB (replica set)
# ---------------------------------------------------------------------------
name: activation-poc

x-common-env: &common-env
  KAFKA_BROKERS: kafka:9092
  MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
  KAFKA_FROM_BEGINNING: "true"
  OUTBOX_POLL_MS: "500"
  UI_ORIGIN: http://localhost:5173
  LOG_LEVEL: info

x-app-defaults: &app-defaults
  restart: unless-stopped
  depends_on:
    kafka-init:
      condition: service_completed_successfully
    mongo-init:
      condition: service_completed_successfully

services:
  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.0
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC_PARTITIONS: "3"
      KAFKA_TOPIC_REPLICATION: "1"
      KAFKA_TOPIC_RETENTION_MS: "604800000"
    volumes:
      - ./docker/create-topics.sh:/scripts/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: activation-poc
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: "false"
      DYNAMIC_CONFIG_ENABLED: "true"

  mongo:
    image: mongo:7.0
    hostname: mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mongo-init:
    image: mongo:7.0
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_HOST: mongo:27017
      MONGO_RS: rs0
    volumes:
      - ./docker/init-mongo.sh:/scripts/init-mongo.sh:ro
    entrypoint: ["/bin/bash", "/scripts/init-mongo.sh"]

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  activation-api:
    <<: *app-defaults
    build:
      context: .
      args:
        APP: activation-api
    environment:
      <<: *common-env
      MONGO_DB: poc_activation
      PORT: "3000"
    ports:
      - "${ACTIVATION_API_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  billing-service:
    <<: *app-defaults
    build:
      context: .
      args:
        APP: billing-service
    environment:
      <<: *common-env
      MONGO_DB: poc_billing
      BILLING_DELAY_MS: "700"

  provisioning-service:
    <<: *app-defaults
    build:
      context: .
      args:
        APP: provisioning-service
    environment:
      <<: *common-env
      MONGO_DB: poc_provisioning
      PROVISIONING_DELAY_MS: "1800"

  notification-service:
    <<: *app-defaults
    build:
      context: .
      args:
        APP: notification-service
    environment:
      <<: *common-env
      MONGO_DB: poc_notifications
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      MAIL_FROM: activaciones@demo.test
      MAIL_INTERVAL_MS: "500"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully
      mailhog:
        condition: service_started

  crm-analytics-service:
    <<: *app-defaults
    build:
      context: .
      args:
        APP: crm-analytics-service
    environment:
      <<: *common-env
      MONGO_DB: poc_crm_analytics
      PORT: "3004"
    ports:
      - "3004:3004"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:3004/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  loyalty-service:
    <<: *app-defaults
    profiles: ["loyalty", "replay"]
    build:
      context: .
      args:
        APP: loyalty-service
    environment:
      <<: *common-env
      MONGO_DB: poc_loyalty
      PORT: "3005"
    ports:
      - "3005:3005"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:3005/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  demo-ui:
    build:
      context: .
      dockerfile: apps/demo-ui/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_INSIGHTS_URL: ${VITE_INSIGHTS_URL:-http://localhost:3004}
        VITE_KAFKA_UI_URL: ${VITE_KAFKA_UI_URL:-http://localhost:8090}
        VITE_MAILHOG_URL: ${VITE_MAILHOG_URL:-http://localhost:8025}
    restart: unless-stopped
    depends_on:
      activation-api:
        condition: service_healthy
      crm-analytics-service:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  kafka-data:
  mongo-data:
