server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA de una sola página: cualquier ruta vuelve al index.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    default_type text/plain;
    return 200 'ok';
  }

  location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
